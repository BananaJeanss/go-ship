services:
  go-ship:
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_HASH: ${COMMIT_HASH:-unknown}
    env_file:
      - .env
    environment:
      DB_PATH: /data/goship.db
    volumes:
      - goship-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://localhost:${PORT:-3000}",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  goship-data:
